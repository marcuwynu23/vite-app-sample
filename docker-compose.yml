
services:
  vite-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vite-app
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - vite-app-data:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    environment:
      NODE_ENV: production

volumes:
  vite-app-data:
    driver: local
